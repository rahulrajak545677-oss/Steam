name: Build APK from uploaded ZIP
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."; exit 1
          fi
      - name: Unzip the uploaded project (on the runner)
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in the repository root. Upload StreamVerse_Updated.zip first."; exit 1; fi
          echo "Using $ZIP"
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q "$ZIP" -d /tmp/src
          SRC=/tmp/src
          if [ ! -f "$SRC/package.json" ]; then
            SRC=$(dirname "$(find /tmp/src -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")
          fi
          if [ ! -f "$SRC/package.json" ]; then echo "::error::package.json not found inside the ZIP."; exit 1; fi
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "Project root: $SRC"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: cd "$SRC" && npm install
      - name: Generate native Android project
        run: cd "$SRC" && npx expo prebuild --platform android --no-install
      - name: Build APK (arm64, test-signed)
        run: cd "$SRC/android" && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$SRC"/android/app/build/outputs/apk/release/*.apk /tmp/StreamVerse.apk
          gh release create "apk-${{ github.run_number }}" /tmp/StreamVerse.apk \
            --repo "${{ github.repository }}" \
            --title "StreamVerse APK #${{ github.run_number }}" \
            --notes "Test build. Install StreamVerse.apk on Android." \
            --target "${{ github.sha }}"
